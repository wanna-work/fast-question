.lead{font-size:1.15rem;max-width:34em;margin-bottom:20px}
.sm{font-size:.92rem;color:var(--mut);max-width:36em;margin-bottom:24px}
.q{padding:22px 0;border-top:1px solid var(--g)}
fieldset{border:0}
.l{display:block;font-weight:700;font-size:1.12rem;margin-bottom:4px}
.l i{font-weight:400;font-size:.8rem;color:var(--mut);font-style:normal;margin-left:8px}
.h{color:var(--mut);font-size:.92rem;margin-bottom:10px}
input[type=text],textarea{width:100%;font:inherit;padding:12px 0;border:0;border-bottom:2px solid var(--ink);background:transparent;border-radius:0}
textarea{min-height:100px;resize:vertical;padding:12px;border:1px solid var(--ink)}
input[type=text]:focus,textarea:focus{outline:0;border-color:var(--red)}
.oth{margin-top:8px}
.o{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--g);cursor:pointer}
.o input{accent-color:var(--red);width:20px;height:20px;flex:none;margin-top:3px}
.err{color:var(--red);font-weight:600;margin-top:8px}
.proj{border:1px solid var(--ink);padding:0 20px 8px;margin:24px 0}
.proj .q:first-of-type{border-top:0}
.ph{display:flex;justify-content:space-between;align-items:center;padding:16px 0 0}
.btn{display:inline-block;background:var(--red);color:#fff;border:2px solid var(--red);font:inherit;font-weight:700;padding:15px 30px;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--ink);border-color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:wait}
.bt{background:none;border:0;font:inherit;font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:4px;cursor:pointer;padding:8px 0}
.bt:hover{color:var(--red)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:32px;padding-top:24px;border-top:1px solid var(--ink)}
.fin{margin-top:32px;border-top:1px solid var(--ink);padding-top:24px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
a{color:var(--red);font-weight:600}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
footer{max-width:760px;margin:0 auto;padding:0 20px 48px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

 return h+'<label class="l" for="'+f+'">'+esc(q.l)+lab+'</label>'+hint+(q.t=="long"?'<textarea id="'+f+'"'+at+'>'+esc(v)+'</textarea>':'<input type="text" id="'+f+'"'+at+(q.t=="url"?' inputmode="url" autocomplete="url"':'')+(q.ac?' autocomplete="'+q.ac+'"':'')+' value="'+esc(v)+'">')+er(k)+'</div>'}
function intro(){return '<h1>Привет! Давай соберём твой опыт в портфолио</h1><p class="lead">Этот опрос поможет мне лучше понять твои сильные стороны, опыт и задачи, которые тебе интересны. На основе ответов я создам сайт, который будет похож именно на тебя.</p><p class="sm">Займёт примерно 7–10 минут. Если пока нечего рассказать о каком-то пункте, ничего страшного: его можно пропустить.</p><button class="btn" type="button" data-act="start">'+(S.a.name?"Продолжить":"Поехали")+'</button>'}

 var h='<p class="ey">Этап '+(s+1)+' из 5 · '+ST[s]+'</p><h2>'+TT[s]+'</h2>';
 if(s==2){h+='<p class="sm">Необязательно иметь известные бренды в портфолио. Подойдут учебные задания, личные проекты, тестовые работы, волонтёрство и задачи, которые ты выполнял(а) сам(а). Я покажу твой реальный вклад и ничего не придумаю. Нет коммерческих проектов? Учебные и личные тоже подойдут.</p>';if(!S.pr.length&&S.a.hasproj&&S.a.hasproj!==NONE)S.pr.push({})}
 if(s==0)h+='<p class="sm">Необязательно формулировать идеально, просто расскажи, как есть.</p>';
 Q.filter(function(q){return q.s==s&&vis(q,S.a)}).forEach(function(q){h+=fld(q,S.a,-1)});
 if(s==2&&S.a.hasproj&&S.a.hasproj!==NONE){
  S.pr.forEach(function(p,i){h+='<div class="proj"><div class="ph"><h3>Проект '+(i+1)+'</h3><button class="bt" type="button" data-act="del" data-n="'+i+'">Удалить</button></div>'+PQ.filter(function(q){return vis(q,p)}).map(function(q){return fld(q,p,i)}).join("")+'</div>'});
  if(S.pr.length<3)h+='<button class="btn" type="button" data-act="add">Добавить проект</button>'}
 if(s==4){
  h+=CH[0]?'':'';
  h+='<div class="fin">'+fld(CH[0],S.a,-1)+'<h3>Как мы будем работать</h3><p class="sm" style="margin-bottom:8px">После анкеты я подготовлю сайт и отправлю тебе ссылку на предварительный просмотр. Ты сможешь проверить содержание, оформление и ссылки. После согласования и оплаты я подготовлю сайт к публикации и передам тебе итоговую версию на условиях нашего заказа.</p>'+fld(CH[1],S.a,-1)+fld(CH[2],S.a,-1)+'<p class="sm">Ответы передаются владельцу сервиса для работы над заказом. Паспортные данные, дату рождения и домашний адрес указывать не нужно.</p><input class="hp" id="hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">'+(S.msg?'<p class="err" role="alert">'+esc(S.msg)+'</p>':"")+'</div>'}
 h+='<div class="nav">'+(s>0?'<button class="bt" type="button" data-act="back">Назад</button>':'<button class="bt" type="button" data-act="home">В начало</button>')+(s<4?'<button class="btn" type="button" data-act="next">Дальше</button>':'<button class="btn" type="button" data-act="send"'+(S.busy?" disabled":"")+'>'+(S.busy?"Отправляю…":"Отправить")+'</button>')+'</div>';
 return h}
function done(){return '<h1>Всё, готово!</h1><p class="lead">Спасибо, что рассказал(а) о себе. Я получил ответы и теперь смогу подготовить основу для твоего сайта. Если понадобится что-то уточнить, я напишу тебе.</p>'}
function render(keep){
 var f=document.activeElement,fk=f&&f.dataset&&f.dataset.i?'[data-i="'+f.dataset.i+'"][data-p="'+f.dataset.p+'"]'+(f.dataset.v?'[data-v="'+f.dataset.v+'"]':f.dataset.o?'[data-o]':':not([data-v]):not([data-o])'):"";
 document.getElementById("app").innerHTML=S.done?done():S.step<0?intro():stage(S.step);
 if(fk&&keep){var n=document.querySelector(fk);if(n)n.focus()}
 var pct=S.done?100:S.step<0?0:(S.step+1)*20;document.querySelector("#bar b").style.width=pct+"%";
 document.getElementById("pl").textContent=S.done||S.step<0?"":"Этап "+(S.step+1)+" из 5";
}

function check(){
 var E=[],a=S.a;function add(s,k,m){E.push({s:s,k:k,m:m})}
 if(!(a.name||"").trim())add(0,"name|-1","Напиши, как к тебе обращаться");
 if(!a.hasproj)add(2,"hasproj|-1","Выбери вариант. Если проектов пока нет, так и отметь");
 if(a.hasproj&&a.hasproj!==NONE)S.pr.forEach(function(p,i){if((p.p_link||"").trim()&&!okU(p.p_link))add(2,"p_link|"+i,URLM)});
 if(vis(findQ("photo_l"),a)&&(a.photo_l||"").trim()&&!okU(a.photo_l))add(4,"photo_l|-1",URLM);
 if(!(a.contact||"").trim()&&!a.c_none)add(4,"contact|-1","Оставь контакт или отметь, что добавим его позже");
 if(!a.truth)add(4,"truth|-1","Нужна отметка, чтобы продолжить");
 if(!a.c_terms)add(4,"c_terms|-1","Нужна отметка, чтобы отправить анкету");
 if(!a.c_pd)add(4,"c_pd|-1","Без согласия мы не сможем принять анкету");
 return E}
function showErr(E){S.err={};E.forEach(function(e){S.err[e.k]=e.m});render();var n=document.querySelector(".err");if(n)n.scrollIntoView({block:"center"})}
function val(q,s){var v=s[q.id],o=s[q.id+"_o"]&&s[q.id+"_o"].trim(),m=function(x){return /друг/i.test(x)&&o?x+" ("+o+")":x};
 v=Array.isArray(v)?v.map(m).join("; "):v&&typeof v=="string"?m(v):"";return String(v||"").trim()}
function brief(){
 var L=["БРИФ ДЛЯ САЙТА-ПОРТФОЛИО (FAST START)","Дата заполнения: "+new Date().toLocaleString("ru-RU"),""],a=S.a,fl=[];
 ST.forEach(function(n,s){var rows=[];Q.forEach(function(q){if(q.s!=s||q.t=="chk"||!vis(q,a))return;var v=val(q,a);if(v)rows.push(q.k+": "+v)});
  if(s==2&&a.hasproj&&a.hasproj!==NONE)S.pr.forEach(function(p,i){var pr=[];PQ.forEach(function(q){if(!vis(q,p))return;var v=val(q,p);if(v)pr.push("  "+q.k+": "+v)});
   if(pr.length){rows.push("","Проект "+(i+1)+(p.p_name?": "+p.p_name.trim():"")+":");rows=rows.concat(pr);
    if(p.p_perm!==YES)fl.push("Проект «"+(p.p_name||i+1)+"»: разрешение на публикацию"+(p.p_perm?" ограничено («"+p.p_perm+"»)":" не указано")+", нужна проверка перед публикацией")}});
  if(rows.length){L.push("== "+ST[s].toUpperCase()+" ==");L=L.concat(rows,"")}});
 if(a.hasproj===NONE)fl.push("Показываемых проектов нет: строить сайт на практических задачах");
 if(!(a.contact||"").trim())fl.push("Нет контакта для сайта: добавить перед публикацией");
 if(!a.photo||/^(Пока нет|Не хочу)/.test(a.photo))fl.push("Фотографии для сайта нет: решение без фотографии");
 else if(/^Есть фотография/.test(a.photo))fl.push("Не уверена пригодность фотографии: проверить");
 if(val(findQ("limits"),a)&&!/^Ограничений нет$/.test(val(findQ("limits"),a)))fl.push("Есть ограничения на публикацию: учесть строго");
 if(fl.length){L.push("== ТРЕБУЕТ УТОЧНЕНИЯ ==");fl.forEach(function(x){L.push("- "+x)})}
 return L.join("\n")}
function prompt(b){return ["ТЫ — опытный веб-дизайнер, редактор портфолио и frontend-разработчик. На основе предоставленного брифа создай персональный сайт-портфолио специалиста.","","Цель: представить реальный опыт человека ясно, профессионально и визуально выразительно, с учётом его специализации, карьерной цели и уровня опыта.","","Требования к содержанию:","1. Сформируй понятное профессиональное позиционирование на основе фактов из брифа.","2. Подготовь убедительный первый экран с заголовком, который конкретно характеризует специалиста. Избегай клише вроде «креативный профессионал», «создаю уникальный контент», «превращаю идеи в результат».","3. Покажи проекты как кейсы: контекст, задача, личный вклад, выполненные действия, результат и выводы, если эти данные предоставлены.","4. Отделяй личную работу специалиста от результатов команды.","5. Не выдумывай метрики, бюджеты, работодателей, клиентов, отзывы, сертификаты, должности, результаты и опыт.","6. Если нет числовых показателей, не пытайся искусственно создать их. Показывай конкретные выполненные задачи и материалы.","7. Учебные и личные проекты обозначай честно.","8. Не публикуй информацию, которую клиент запретил раскрывать или на которую не подтверждено разрешение.","9. Если информации не хватает, используй нейтральную формулировку или опусти блок. Не заполняй пробелы выдуманными данными.","10. Не включай в сайт служебные заметки, инструкции для разработчика и черновые комментарии.","","Требования к дизайну:","- Создай индивидуальный визуальный язык, подходящий сфере и личности специалиста.","- Используй продуманную типографику, сетку, отступы и композицию.","- Не своди сайт к набору однотипных карточек.","- Обеспечь хорошую читаемость и адаптацию под мобильные устройства.","- Не используй фотографии, изображения проектов или логотипы, которых нет в предоставленных материалах, как будто они настоящие.","- Если фотографий нет, выбери подходящее решение без фотографии.","- Не делай сайт похожим на типовой шаблон конструктора.","","Технические требования:","- Верни полностью готовый файл index.html с HTML, CSS и JavaScript внутри.","- Не используй обязательные платные сервисы и API.","- Проверь корректность ссылок, адаптивность и отсутствие неработающих элементов.","- Сделай код структурированным и удобным для последующего редактирования.","- Используй только предоставленные данные и материалы.","- В конце кратко перечисли, какие данные нужно уточнить перед публикацией, если такие остались.","","Ниже приведён структурированный бриф клиента. Он является источником фактов для сайта.","",b].join("\n")}
function send(){
 if(S.busy)return;var E=check();if(E.length){S.step=E[0].s;showErr(E);return}
 if(!CONFIG.ENDPOINT){S.msg="Отправка пока не настроена владельцем сервиса. Твои ответы сохранены в этом браузере, ничего не потеряется.";render(true);return}
 var b=brief(),hp=document.getElementById("hp"),body=JSON.stringify({id:S.id,name:S.a.name.trim(),brief:b,prompt:prompt(b),consent_pd:true,consent_terms:true,truth:true,sent_at:new Date().toISOString(),website:hp?hp.value:""});
 if(body.length>CONFIG.MAXBODY){S.msg="Ответы получились слишком объёмными. Сократи самые длинные тексты и попробуй снова.";render(true);return}
 S.busy=true;S.msg="";render(true);
 fetch(CONFIG.ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:body}).then(function(r){return r.json()}).then(function(j){if(!j||!j.ok)throw 0;S.busy=false;S.done=true;try{localStorage.removeItem(KEY)}catch(e){}render();window.scrollTo(0,0)}).catch(function(){S.busy=false;S.msg="Не получилось отправить. Ответы сохранены, попробуй ещё раз.";render(true)})}

 else return;

 else if(x=="home")go(-1);

 else if(x=="next"){var E=check().filter(function(z){return z.s==S.step});if(E.length)showErr(E);else go(S.step+1)}

 else if(x=="add"){if(S.pr.length<3){S.pr.push({});save();render(true)}}
 else if(x=="del"){S.pr.splice(+b.dataset.n,1);save();render(true)}
 else if(x=="reset"){if(confirm("Удалить все ответы и начать заново? Это нельзя отменить.")){try{localStorage.removeItem(KEY)}catch(e){}S={step:-1,a:{},pr:[],id:uid(),err:{},busy:false,done:false,msg:""};render();window.scrollTo(0,0)}}});
render();
